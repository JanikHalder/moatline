# Moatline from the published images — for self-hosting on any
# Docker host. Set the three required variables (see .env.example next to
# this file), then: docker compose up -d
#
# Images: ghcr.io/janikhalder/moatline-{api,web}. Pin a released
# version with PC_VERSION=1.2.3; `main` follows the newest commit.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: package_checker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a database password}
      POSTGRES_DB: package_checker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U package_checker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/janikhalder/moatline-api:${PC_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://package_checker:${POSTGRES_PASSWORD}@postgres:5432/package_checker
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?at least 32 characters, e.g. openssl rand -base64 32}
      SECRETS_KEY: ${SECRETS_KEY:?a strong passphrase, e.g. openssl rand -base64 32}
      # The public URL people open — also what invitation links point to.
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:8080}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      APP_URL: ${PUBLIC_URL:-http://localhost:8080}
      # Where agents on other servers report to, when not the public URL
      # (e.g. a Tailscale address).
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      ENABLE_SCHEDULER: "true"
      # Mail for sign-up confirmations, password resets and invitations when
      # an organization has no mail server of its own: Resend (MAIL_FROM on a
      # domain verified there) or, instead, any SMTP server.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Hosting Moatline for others (open sign-up, no repository code runs
      # here) — see docs/CLOUD.md. Leave off for your own team.
      CLOUD_MODE: ${CLOUD_MODE:-false}
      BILLING_FREE_ORGS: ${BILLING_FREE_ORGS:-}
      OPERATOR_EMAILS: ${OPERATOR_EMAILS:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_SOLO: ${STRIPE_PRICE_SOLO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      STRIPE_PRICE_AGENCY: ${STRIPE_PRICE_AGENCY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PORT: "3001"
      # One-click updates from Settings → Updates, the way Dokploy does it:
      # set SELF_UPDATE=true and mount the Docker socket below. The socket
      # gives this container root on the host — leave both off to update by
      # hand (docker compose pull && docker compose up -d).
      SELF_UPDATE: ${SELF_UPDATE:-false}
      # Where releases are looked up (owner/repo on GitHub).
      UPDATE_REPO: ${UPDATE_REPO:-}
    # The API does not run as root: give it the socket's group
    # (stat -c %g /var/run/docker.sock on the host; often 999 or 988).
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_GID:-999}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    image: ghcr.io/janikhalder/moatline-web:${PC_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres_data:
