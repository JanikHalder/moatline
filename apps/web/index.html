<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Moatline</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!--
      Apply the stored theme before first paint, otherwise a dark-mode user
      gets a white flash on every load. Mirrors src/lib/theme.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("pc-theme") || "system";
          var dark =
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* storage disabled – fall back to the light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
