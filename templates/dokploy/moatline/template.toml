[variables]
main_domain = "${domain}"
postgres_password = "${password:32}"
auth_secret = "${base64:48}"
secrets_key = "${base64:48}"

[config]
env = [
  "PUBLIC_URL=https://${main_domain}",
  "POSTGRES_PASSWORD=${postgres_password}",
  "BETTER_AUTH_SECRET=${auth_secret}",
  "SECRETS_KEY=${secrets_key}",
]
mounts = []

[[config.domains]]
serviceName = "web"
port = 80
host = "${main_domain}"
