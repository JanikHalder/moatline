name: Bug report
description: Something does not work as documented.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security issues go through
        [Security Advisories](https://github.com/JanikHalder/moatline/security/advisories/new),
        not this form.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, self-hosted or cloud, versions if you know them.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Moatline version, image tag, or git commit if known.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Self-hosted
        - Moatline Cloud
        - Unsure
    validations:
      required: true
